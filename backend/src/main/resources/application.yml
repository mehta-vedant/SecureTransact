spring:
  application:
    name: securetransact
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/securetransact}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration

app:
  jwt:
    secret: ${APP_JWT_SECRET}
    expiration-ms: ${APP_JWT_EXPIRATION_MS:86400000}
  cookie:
    secure: ${APP_COOKIE_SECURE:true}
    same-site: ${APP_COOKIE_SAME_SITE:lax}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  security:
    auth-rate-limit: ${AUTH_RATE_LIMIT_PER_MINUTE:10}
  admin:
    email: ${ADMIN_EMAIL:}
    password: ${ADMIN_PASSWORD:}
  ml:
    # Synthetic-baseline IsolationForest is experimental. Enable only for the controlled
    # demo sidecar; policy rules and human review remain the default decision path.
    enabled: ${APP_ML_ENABLED:false}
    base-url: ${APP_ML_BASE_URL:http://localhost:5001}
    timeout-ms: ${APP_ML_TIMEOUT_MS:500}
  demo:
    enabled: ${APP_DEMO_ENABLED:false}
    source-email: ${APP_DEMO_SOURCE_EMAIL:alice@demo.securetransact.app}
    source-password: ${APP_DEMO_SOURCE_PASSWORD:demo-alice-1234}
    merchant-email: ${APP_DEMO_MERCHANT_EMAIL:merchant@demo.securetransact.app}
  simulator:
    ambient-interval-ms: ${APP_SIMULATOR_AMBIENT_INTERVAL_MS:8000}
  swagger-enabled: ${APP_SWAGGER_ENABLED:false}

server:
  port: ${PORT:8080}

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
